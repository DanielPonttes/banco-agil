[project]
name = "banco-agil"
version = "0.1.0"
description = "Atendimento bancário multiagente com Gemini, LangGraph e Streamlit"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "filelock>=3.16,<4",
  "google-genai>=1.0,<3",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banco_agil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: integration tests that require real external credentials"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

